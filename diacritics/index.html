<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diacritice</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='8' y='13' font-size='14' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23e8ff59'%3E%C8%99%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo">ș</span>Diacritice</div>
      <div class="group">
        <button id="paste" title="Paste from the clipboard">Paste</button>
        <button id="open" title="Open a .txt file (or drop one)">Open</button>
        <button id="sample" title="Load a sample text">Sample</button>
        <button id="clear" title="Clear the input">Clear</button>
      </div>
      <div class="group">
        <label class="inline" title="Words you typed with diacritics keep them; only missing ones are filled in">
          <input type="checkbox" id="keep" checked /> Keep typed diacritics
        </label>
        <label class="inline" title="Highlight words the model was unsure about">
          <input type="checkbox" id="show-unsure" checked /> Show unsure
        </label>
      </div>
      <div class="group right">
        <button id="download" title="Download the result as a .txt file">Download</button>
        <button id="copy" class="primary" title="Copy the result (⌘/Ctrl + Shift + C)">Copy</button>
      </div>
    </header>
    <main class="panes">
      <section class="pane">
        <div class="pane-head"><h2>Fără diacritice</h2><span class="hint" id="in-count"></span></div>
        <textarea id="input" spellcheck="false" placeholder="Scrie sau lipește text fără diacritice, de exemplu: Si daca ma intrebi pe mine, tara asta are nevoie de oameni care sa munceasca."></textarea>
      </section>
      <section class="pane">
        <div class="pane-head"><h2>Cu diacritice</h2><span class="hint" id="out-count"></span></div>
        <div id="output" class="output" tabindex="0" aria-live="polite"></div>
      </section>
    </main>
    <footer class="statusbar">
      <span id="status">Loading model…</span>
      <span class="spacer"></span>
      <span class="legend"><i class="sw changed"></i>changed <i class="sw unsure"></i>unsure</span>
    </footer>
    <div id="popover" class="popover" hidden></div>
    <div id="drop" class="drop">Drop a .txt file</div>
    <div id="toast" class="toast"></div>
    <input type="file" id="file" accept=".txt,.md,.srt,.csv,text/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
