# Builds Toolbox for macOS (Apple Silicon), Windows and Linux.
# Pull requests that touch the app and manual runs only build (the installers
# are attached to the run). Pushing a tag like toolbox-v0.2.0, or a manual run
# with a version filled in, also publishes them on a GitHub Release with the
# install notes from toolbox/INSTALL.md, after toolbox/release-notes/<version>.md
# when that file exists.
name: Toolbox release

on:
  push:
    tags: ["toolbox-v*"]
  pull_request:
    paths: ["toolbox/**", "dither/**", "ascii/**", "diacritics/**", "audio/**", "media/**", "pdf/**", "package-lock.json", ".github/workflows/toolbox-release.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, e.g. 0.2.0 (creates tag toolbox-v<version>). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist
            files: toolbox/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: toolbox/release/*.exe
          - os: ubuntu-22.04
            script: dist:linux
            files: toolbox/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installs every workspace; ffmpeg-static fetches the ffmpeg binary for this OS.
      - run: npm ci
      - name: Use the release's version
        if: startsWith(github.ref, 'refs/tags/toolbox-v') || inputs.release
        shell: bash
        env:
          VERSION: ${{ inputs.release || github.ref_name }}
        run: npm pkg set version="${VERSION#toolbox-v}" --workspace toolbox
      - run: npm test --workspace toolbox
      - run: npm run ${{ matrix.script }} --workspace toolbox
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/toolbox-v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What's new (toolbox/release-notes/<version>.md, when there is one) above the install steps.
      - name: Write the release notes
        run: |
          v="${VERSION#toolbox-v}"
          echo "TOOLBOX_VERSION=$v" >> "$GITHUB_ENV"
          notes="toolbox/release-notes/$v.md"
          { if [ -f "$notes" ]; then cat "$notes"; echo; fi; cat toolbox/INSTALL.md; } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: toolbox-v${{ env.TOOLBOX_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Toolbox ${{ env.TOOLBOX_VERSION }}
          body_path: release-body.md
          files: dist/*
