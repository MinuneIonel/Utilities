# Builds Toolbox for macOS (Apple Silicon), Windows and Linux.
# Pull requests that touch the app and manual runs only build (the installers
# are attached to the run). Pushing a tag like toolbox-v0.2.0 also publishes
# them on a GitHub Release with the install notes from toolbox/INSTALL.md.
name: Toolbox release

on:
  push:
    tags: ["toolbox-v*"]
  pull_request:
    paths: ["toolbox/**", "dither/**", "ascii/**", "diacritics/**", "audio/**", "media/**", "pdf/**", "package-lock.json", ".github/workflows/toolbox-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist
            files: toolbox/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: toolbox/release/*.exe
          - os: ubuntu-22.04
            script: dist:linux
            files: toolbox/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installs every workspace; ffmpeg-static fetches the ffmpeg binary for this OS.
      - run: npm ci
      - name: Use the tag's version
        if: startsWith(github.ref, 'refs/tags/toolbox-v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#toolbox-v}" --workspace toolbox
      - run: npm test --workspace toolbox
      - run: npm run ${{ matrix.script }} --workspace toolbox
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/toolbox-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Toolbox ${{ github.ref_name }}
          body_path: toolbox/INSTALL.md
          files: dist/*
