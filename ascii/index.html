<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111214'/%3E%3Ctext x='8' y='12.5' font-family='monospace' font-weight='bold' font-size='13' text-anchor='middle' fill='%23e8ff59'%3E%40%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo">@</span>ASCII Lab</div>
      <div class="group">
        <button id="open-image" title="Open an image (or drop / paste one)">Image</button>
        <button id="open-video" title="Open a video file">Video</button>
        <button id="open-webcam" title="Use your webcam">Webcam</button>
        <button id="open-sample" title="Load the sample image">Sample</button>
      </div>
      <div class="group">
        <select id="preset-menu" title="Presets"></select>
        <button id="preset-save" title="Save the current settings as a preset">Save</button>
        <button id="preset-share" title="Copy a link containing these settings">Share link</button>
        <button id="preset-export" title="Download the preset as JSON">Export</button>
        <button id="preset-import" title="Load a preset JSON file">Import</button>
      </div>
      <div class="group right">
        <button id="copy-text" class="primary" title="Copy the ASCII art as plain text">Copy text</button>
        <select id="export-menu" title="Download">
          <option value="">Download…</option>
          <option value="txt">Text (.txt)</option>
          <option value="html">HTML page (.html)</option>
          <option value="ansi">ANSI for terminals (.ans)</option>
          <option value="svg">SVG</option>
          <option value="png1">PNG</option>
          <option value="png2">PNG 2×</option>
          <option value="png4">PNG 4×</option>
        </select>
        <button id="record" title="Record the output to a video file">● Rec</button>
      </div>
    </header>
    <main class="layout">
      <aside class="panel">
        <div class="hint source" id="source-info">No source</div>
        <div id="controls" class="controls"></div>
        <p class="hint">Double-click a slider to reset it. Hold <kbd>Space</kbd> or the compare button to see the original.</p>
      </aside>
      <section class="viewer" id="viewer">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="out"></canvas>
          <canvas id="orig" hidden></canvas>
        </div>
        <div class="viewer-bar">
          <button id="zoom-fit">Fit</button>
          <button id="zoom-out">−</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in">+</button>
          <button id="compare" title="Hold to see the original">Compare</button>
          <button id="pause" hidden>Pause</button>
          <span class="spacer"></span>
          <span id="stats"></span>
        </div>
        <div class="drop" id="drop">Drop an image, video or preset</div>
        <div class="toast" id="toast"></div>
      </section>
    </main>
    <input type="file" id="file-image" accept="image/*" hidden />
    <input type="file" id="file-video" accept="video/*" hidden />
    <input type="file" id="file-preset" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
